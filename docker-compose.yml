services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-broker
    hostname: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
      - "${KAFKA_CONTROLLER_PORT:-9093}:9093"
    environment:
      KAFKA_NODE_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-9093},PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092}'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '${KAFKA_BROKER_ID:-1}@kafka:${KAFKA_CONTROLLER_PORT:-9093}'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: ${KAFKA_JMX_PORT:-9101}
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: '${KAFKA_AUTO_CREATE_TOPICS:-true}'
      CLUSTER_ID: '${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}'
      KAFKA_PROCESS_ROLES: 'broker,controller'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:${KAFKA_INTERNAL_PORT:-29092} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    hostname: schema-registry
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT:-29092}'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_AVRO_COMPATIBILITY_LEVEL: '${SCHEMA_REGISTRY_COMPAT_LEVEL:-backward}'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: citypass
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_INTERNAL_PORT:-29092}
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    restart: unless-stopped

  auth-simulator:
    build:
      context: ./auth-simulator
      dockerfile: Dockerfile
    container_name: auth-simulator
    ports:
      - "${AUTH_SIMULATOR_PORT:-8083}:8083"
    environment:
      PORT: 8083
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  event-gateway:
    build:
      context: ./event-gateway
      dockerfile: Dockerfile
    container_name: event-gateway
    ports:
      - "${EVENT_GATEWAY_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      auth-simulator:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT:-29092}
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMAS_DIR: /app/schemas
      DATA_DIR: /app/data
      SECURITY_ENABLED: ${SECURITY_ENABLED:-false}
      AUTH_SERVICE_URL: http://auth-simulator:8083
      DLQ_TOPIC: ${DLQ_TOPIC:-sistema.dlq}
    volumes:
      - event-gateway-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  ejemplo-productor:
    build:
      context: ./ejemplo-productor
      dockerfile: Dockerfile
    container_name: ejemplo-productor
    ports:
      - "${EJEMPLO_PRODUCTOR_PORT:-3000}:3000"
    depends_on:
      event-gateway:
        condition: service_healthy
    environment:
      EVENT_GATEWAY_URL: http://event-gateway:8080
      PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ejemplo-consumidor:
    build:
      context: ./ejemplo-consumidor
      dockerfile: Dockerfile
    container_name: ejemplo-consumidor
    ports:
      - "${EJEMPLO_CONSUMIDOR_PORT:-3001}:3001"
    depends_on:
      event-gateway:
        condition: service_healthy
    environment:
      EVENT_GATEWAY_URL: http://event-gateway:8080
      SELF_URL: http://ejemplo-consumidor:3001
      PORT: 3001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  anomaly-detector:
    build:
      context: ./anomaly-detector
      dockerfile: Dockerfile
    container_name: anomaly-detector
    ports:
      - "${ANOMALY_DETECTOR_PORT:-8084}:8084"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT:-29092}
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PORT: 8084
      CONSUMER_GROUP_ID: anomaly-detector-group
      MIN_SAMPLES_TO_TRAIN: ${ANOMALY_MIN_SAMPLES:-50}
      RETRAIN_EVERY_N: ${ANOMALY_RETRAIN_EVERY_N:-100}
      CONTAMINATION: ${ANOMALY_CONTAMINATION:-0.05}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8084/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  kafka-data:
  event-gateway-data:
