# Rotación del log de todos los contenedores.
#
# El driver json-file no tiene límite por defecto: lo que un servicio escriba se guarda
# para siempre. Es la forma más silenciosa de llenar el disco, porque no pasa por ningún
# rate limit ni deja rastro en la aplicación.
#
# Va como ancla y no en /etc/docker/daemon.json —que sería lo habitual— porque los
# valores dependen del ambiente y la fuente de la verdad tiene que ser el .env.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-3}"

services:
  kafka-authorizer:
    mem_limit: ${MEM_LIMIT_KAFKA:?falta MEM_LIMIT_KAFKA en el .env}
    logging: *logging
    image: ${IMAGE_PREFIX:-citypass-eda}/kafka-authorizer:${TAG:-latest}
    build:
      context: ./kafka-authorizer
    container_name: kafka-authorizer
    hostname: kafka-authorizer
    ports:
      # El 9093 (controller de KRaft) no se publica: es el plano de control del
      # cluster —ahí vive el log de metadatos con las ACLs— y sólo lo usa el broker
      # consigo mismo. Exponerlo sería una puerta lateral por encima de toda la
      # autorización del listener externo.
      - "${PUBLISH_ADDR:-127.0.0.1}:${KAFKA_HOST_PORT:-19092}:9092"
    depends_on:
      # El listener externo valida los JWT contra el JWKS del auth-simulator, así que
      # necesita que esté arriba antes de aceptar conexiones.
      auth-simulator:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # Tres listeners con propósitos distintos:
      #   INTERNAL  (29092) — servicios del compose, sin autenticar, sólo red de Docker
      #   CONTROLLER (9093) — quórum de KRaft, nunca sale del contenedor
      #   EXTERNAL   (9092) — los grupos, autenticados con el JWT del auth-simulator
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-authorizer:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST}:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'

      # ── Autenticación del listener externo: OAUTHBEARER contra el auth-simulator ──
      # El broker valida la firma del JWT con el mismo JWKS que usa el event-gateway,
      # así que la identidad es una sola para toda la plataforma: revocar un cliente
      # en el auth-simulator lo deja afuera del bus y de la API REST a la vez.
      KAFKA_SASL_ENABLED_MECHANISMS: 'OAUTHBEARER'
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;'
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: 'org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerValidatorCallbackHandler'
      KAFKA_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: 'http://auth-simulator:8083/.well-known/jwks.json'
      KAFKA_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: 'citypass'
      # El principal es el namespace y no el `sub`: identifica al grupo, y un consumer
      # group es por aplicación. Con el usuario individual, dos instancias del mismo
      # grupo corriendo con credenciales distintas no podrían compartir el group.id.
      KAFKA_SASL_OAUTHBEARER_SUB_CLAIM_NAME: 'namespace'

      # ── Autorización ──
      # El autorizador deriva la política del propio JWT en cada conexión, así que no
      # hay ACLs ni ninguna lista de grupos que mantener sincronizada con el servicio
      # de identidad: si deja de emitir tokens para un grupo, el acceso se corta solo.
      KAFKA_AUTHORIZER_CLASS_NAME: 'com.citypass.kafka.NamespaceAuthorizer'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-authorizer:9093'
      # Retención por TAMAÑO, no sólo por tiempo. La de tiempo que trae el broker por
      # defecto no acota el disco: si entran más datos de los que caben, se llena igual.
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_RETENTION_BYTES:?falta KAFKA_RETENTION_BYTES en el .env}
      # Kafka borra segmentos enteros: si el segmento fuera más grande que la retención,
      # el techo de arriba no podría aplicarse nunca.
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_SEGMENT_BYTES:?falta KAFKA_SEGMENT_BYTES en el .env}
      # Cada cuánto se revisa si hay segmentos para borrar. El default son 5 minutos, que
      # con techos chicos deja el disco por encima del límite demasiado tiempo.
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      # Único mecanismo de la imagen de Confluent para fijar auto.create.topics.enable.
      # En false, un tópico sólo puede nacer de una creación explícita: el gateway al
      # registrar un event type, y cada servicio los suyos. Sin esto, un typo en un
      # nombre crea un tópico nuevo en silencio en vez de fallar.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_PROCESS_ROLES: 'broker,controller'
    volumes:
      - kafka-data:/var/lib/kafka/data
      # Las imágenes de Confluent declaran un `VOLUME` para los certificados TLS. Acá el
      # TLS termina en el reverse-proxy, así que ese directorio queda vacío — pero si no se
      # monta nada, Docker le crea un volumen anónimo con nombre de hash que queda huérfano
      # en cada `down`. Montarle uno con nombre no lo evita, pero lo hace identificable.
      #
      # Un `tmpfs` no sirve para esto: se monta, y Docker crea el volumen anónimo igual.
      - kafka-secrets:/etc/kafka/secrets
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  schema-registry:
    mem_limit: ${MEM_LIMIT_SCHEMA_REGISTRY:?falta MEM_LIMIT_SCHEMA_REGISTRY en el .env}
    logging: *logging
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    hostname: schema-registry
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:8081:8081"
    depends_on:
      kafka-authorizer:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka-authorizer:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_AVRO_COMPATIBILITY_LEVEL: 'backward'
    volumes:
      # Mismo caso que el broker: el VOLUME de la imagen es para certificados TLS que acá
      # no se usan, y sin montarle nada Docker genera un volumen anónimo con nombre de hash.
      - schema-registry-secrets:/etc/schema-registry/secrets
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    mem_limit: ${MEM_LIMIT_KAFKA_UI:?falta MEM_LIMIT_KAFKA_UI en el .env}
    logging: *logging
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      # kafka-ui tiene su propia variable en vez de seguir a PUBLISH_ADDR: es la única
      # consola con permisos de administración del cluster, así que conviene poder
      # dejarla en loopback aunque el resto esté publicado.
      #
      # En 127.0.0.1 sigue corriendo y se llega por túnel SSH, que es el acceso normal
      # en producción; en 0.0.0.0 queda expuesta a la red.
      - "${KAFKA_UI_PUBLISH_ADDR:-127.0.0.1}:8090:8080"
    depends_on:
      kafka-authorizer:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: citypass
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-authorizer:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

      # kafka-ui administra el cluster entero y no puede usar el servicio de identidad:
      # ese sólo soporta client_credentials y un navegador no tiene cómo autenticarse
      # contra él. Así que lleva su propio login, que es la única credencial del sistema
      # fuera del auth-simulator.
      #
      # La autenticación va acá dentro y no en el reverse-proxy a propósito: si algún día
      # PUBLISH_ADDR queda en 0.0.0.0, kafka-ui se publica solo y se llega al 8090 sin
      # pasar por nginx, así que una autenticación en el proxy no protegería nada.
      #
      # En producción no se llega igual: el acceso normal es por túnel SSH. Esto es la
      # red que queda si la configuración de puertos sale mal.
      #
      # La sintaxis `:?` aborta el arranque si la variable falta, en vez de dejar la
      # consola con una contraseña vacía.
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:?falta KAFKA_UI_USER en el .env}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?falta KAFKA_UI_PASSWORD en el .env}
    restart: unless-stopped

  auth-simulator:
    mem_limit: ${MEM_LIMIT_AUTH_SIMULATOR:?falta MEM_LIMIT_AUTH_SIMULATOR en el .env}
    logging: *logging
    image: ${IMAGE_PREFIX:-citypass-eda}/auth-simulator:${TAG:-latest}
    build:
      context: ./auth-simulator
      dockerfile: Dockerfile
    container_name: auth-simulator
    hostname: auth-simulator
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:8083:8083"
    environment:
      PORT: 8083
      AUTH_CORS_ORIGIN: '${AUTH_CORS_ORIGIN}'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  event-gateway:
    mem_limit: ${MEM_LIMIT_EVENT_GATEWAY:?falta MEM_LIMIT_EVENT_GATEWAY en el .env}
    logging: *logging
    image: ${IMAGE_PREFIX:-citypass-eda}/event-gateway:${TAG:-latest}
    build:
      context: ./event-gateway
      dockerfile: Dockerfile
    container_name: event-gateway
    hostname: event-gateway
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:8080:8080"
      # Métricas: siempre en loopback, nunca por PUBLISH_ADDR ni por el reverse-proxy.
      # Se leen por túnel SSH, igual que kafka-ui.
      - "127.0.0.1:9090:9090"
    depends_on:
      kafka-authorizer:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      auth-simulator:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka-authorizer:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMAS_DIR: /app/schemas
      DATA_DIR: /app/data
      AUTH_SERVICE_URL: http://auth-simulator:8083
      DLQ_TOPIC: sistema.dlq
      # Multiplicados dan la velocidad máxima a la que un equipo puede llenar el disco.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:?falta RATE_LIMIT_PER_MINUTE en el .env}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:?falta MAX_PAYLOAD_BYTES en el .env}
      # Único lugar donde se puede acotar cuántos tópicos llegan a existir: el gateway es
      # el único que los crea.
      MAX_EVENT_TYPES_PER_NAMESPACE: ${MAX_EVENT_TYPES_PER_NAMESPACE:?falta MAX_EVENT_TYPES_PER_NAMESPACE en el .env}
      TOPIC_PARTITIONS: 1
      TOPIC_REPLICATION_FACTOR: 1
      GATEWAY_CORS_ORIGIN: '${GATEWAY_CORS_ORIGIN}'
      # Único interruptor de ambiente del gateway: `development` afloja los webhooks
      # hacia red interna, publica Swagger y sube el log a DEBUG, los tres juntos.
      # Cualquier otro valor —vacío, mal escrito— deja la configuración de producción.
      SPRING_PROFILES_ACTIVE: '${SPRING_PROFILES_ACTIVE:-}'
    volumes:
      - event-gateway-schemas:/app/schemas
      - event-gateway-data:/app/data
    healthcheck:
      # wget viene en el busybox de Alpine; curl habría que instalarlo, lo que agrega
      # una capa y —al construir para ARM desde un runner x86— obliga a emular.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  event-gateway-ui:
    mem_limit: ${MEM_LIMIT_EVENT_GATEWAY_UI:?falta MEM_LIMIT_EVENT_GATEWAY_UI en el .env}
    logging: *logging
    image: ${IMAGE_PREFIX:-citypass-eda}/event-gateway-ui:${TAG:-latest}
    build:
      context: ./event-gateway-ui
      dockerfile: Dockerfile
    container_name: event-gateway-ui
    hostname: event-gateway-ui
    # En runtime, no como argumentos de build: la imagen no sabe a qué ambiente sirve
    # hasta que arranca, así que la misma vale para todos. `?` porque sin ellas la UI
    # no puede hablar con nadie, y es mejor que el contenedor no levante a que levante
    # apuntando a ningún lado.
    environment:
      LOGIN_API_URL: '${LOGIN_API_URL:?falta LOGIN_API_URL}'
      GATEWAY_API_URL: '${GATEWAY_API_URL:?falta GATEWAY_API_URL}'
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:5173:80"
    depends_on:
      event-gateway:
        condition: service_healthy
      auth-simulator:
        condition: service_healthy
    restart: unless-stopped

  anomaly-detector:
    mem_limit: ${MEM_LIMIT_ANOMALY_DETECTOR:?falta MEM_LIMIT_ANOMALY_DETECTOR en el .env}
    logging: *logging
    image: ${IMAGE_PREFIX:-citypass-eda}/anomaly-detector:${TAG:-latest}
    build:
      context: ./anomaly-detector
      dockerfile: Dockerfile
    container_name: anomaly-detector
    hostname: anomaly-detector
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:8084:8084"
    depends_on:
      kafka-authorizer:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-authorizer:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PORT: 8084
      CONSUMER_GROUP_ID: anomaly-detector-group
      MIN_SAMPLES_TO_TRAIN: 50
      RETRAIN_EVERY_N: 100
      CONTAMINATION: 0.05
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8084/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Observabilidad ──────────────────────────────────────────────────────────
  # El gateway expone sus métricas, pero sin alguien que las consulte sólo se ve el valor
  # instantáneo. Prometheus guarda la serie y Grafana la muestra.
  prometheus:
    mem_limit: ${MEM_LIMIT_PROMETHEUS:?falta MEM_LIMIT_PROMETHEUS en el .env}
    logging: *logging
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    hostname: prometheus
    ports:
      # 9091 en el host porque el 9090 ya lo usa el puerto de management del gateway.
      # Adentro de la red sigue siendo 9090, que es su puerto por convención.
      - "${PUBLISH_ADDR:-127.0.0.1}:9091:9090"
    depends_on:
      event-gateway:
        condition: service_healthy
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    mem_limit: ${MEM_LIMIT_GRAFANA:?falta MEM_LIMIT_GRAFANA en el .env}
    logging: *logging
    image: grafana/grafana:11.5.1
    container_name: grafana
    hostname: grafana
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      - prometheus
    environment:
      # Mismo criterio que kafka-ui: sin default seguro para una contraseña, el compose
      # se niega a arrancar antes que quedar con `admin`/`admin`.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?falta GRAFANA_USER en el .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?falta GRAFANA_PASSWORD en el .env}
      # Nadie se registra solo: los usuarios los crea el administrador.
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # ── Sólo producción ─────────────────────────────────────────────────────────
  # Estos dos servicios existen únicamente cuando COMPOSE_PROFILES=prod en el
  # .env. En desarrollo no se levantan y cada servicio se habla directo por su puerto.
  reverse-proxy:
    logging: *logging
    image: nginx:1.27-alpine
    profiles: ["prod"]
    container_name: reverse-proxy
    hostname: reverse-proxy
    ports:
      # El único servicio que escucha en todas las interfaces. El resto publica sobre
      # PUBLISH_ADDR, que en producción es 127.0.0.1.
      - "80:80"
      - "443:443"
      - "9092:9092"
    depends_on:
      event-gateway:
        condition: service_healthy
    # Los límites por IP dependen del ambiente, así que la configuración es una
    # plantilla que el entrypoint completa al arrancar.
    environment:
      NGINX_MAX_BODY: ${NGINX_MAX_BODY:?falta NGINX_MAX_BODY en el .env}
      NGINX_RATE_LIMIT: ${NGINX_RATE_LIMIT:?falta NGINX_RATE_LIMIT en el .env}
      NGINX_RATE_BURST: ${NGINX_RATE_BURST:?falta NGINX_RATE_BURST en el .env}
      NGINX_CONN_LIMIT: ${NGINX_CONN_LIMIT:?falta NGINX_CONN_LIMIT en el .env}
    volumes:
      - ./reverse-proxy/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./reverse-proxy/entrypoint.sh:/entrypoint.sh:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

  # Emite y renueva el certificado. Un solo certificado con nombre fijo `citypass`
  # sirve a la vez para HTTPS y para el listener TLS de Kafka.
  certbot:
    logging: *logging
    image: certbot/certbot:latest
    profiles: ["prod"]
    container_name: certbot
    hostname: certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Reintenta la renovación cada 12 horas. Let's Encrypt sólo renueva cuando falta
    # menos de 30 días, así que las demás corridas no hacen nada.
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'
    restart: unless-stopped

volumes:
  kafka-data:
  # Vacíos a propósito: existen sólo para que el `VOLUME` de las imágenes de Confluent no
  # genere volúmenes anónimos. Si algún día el TLS se mueve al broker, van acá los keystores.
  kafka-secrets:
  schema-registry-secrets:
  prometheus-data:
  grafana-data:
  certbot-conf:
  certbot-www:
  event-gateway-schemas:
  event-gateway-data:
