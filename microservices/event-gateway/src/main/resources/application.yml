server:
  port: ${SERVER_PORT}

spring:
  application:
    name: event-gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        acks: all
        retries: 3

gateway:
  schemas-dir: ${SCHEMAS_DIR}
  schema-registry-url: ${SCHEMA_REGISTRY_URL}
  auth-service-url: ${AUTH_SERVICE_URL}
  cors-origin: ${GATEWAY_CORS_ORIGIN}
  # Los tópicos se crean al registrar el event type, no al publicar el primer evento,
  # así que estos valores reemplazan a los defaults del broker.
  topic-partitions: ${TOPIC_PARTITIONS:1}

  # Máximo de event types por namespace.
  #
  # El gateway es el único que puede crear tópicos —el authorizer se lo niega a todo
  # cliente externo y la autocreación del broker está apagada—, así que este es el único
  # lugar donde se puede acotar cuántos llegan a existir. Sin techo, el disco tampoco lo
  # tiene: cada event type es una partición con su propia retención.
  max-event-types-per-namespace: ${MAX_EVENT_TYPES_PER_NAMESPACE:25}

  # Techo del bus entero, sumando todos los equipos.
  #
  # El de arriba impide que un equipo solo acapare; este acota el total, que es lo que
  # multiplica a la retención de Kafka y por lo tanto lo que ocupa el disco. Si se agota,
  # no puede crear nadie —tenga o no lugar en su propio cupo— hasta que se borre alguno.
  max-event-types-total: ${MAX_EVENT_TYPES_TOTAL:200}

  # Máximo de versiones mayores de un mismo event type.
  #
  # Cada versión es un tópico con su propia retención. Sin este techo, un PUT en bucle con
  # schemas incompatibles multiplica los tópicos de a uno por llamada, que es la forma más
  # rápida de llenar el disco teniendo credenciales.
  max-versions-per-event-type: ${MAX_VERSIONS_PER_EVENT_TYPE:5}
  topic-replication-factor: ${TOPIC_REPLICATION_FACTOR:1}
  # Audiencia que debe declarar el JWT para ser aceptado.
  token-audience: ${TOKEN_AUDIENCE:citypass}

  # Emisor esperado de los tokens. Vacío desactiva el chequeo, para no romper un
  # despliegue cuyo servicio de identidad todavía no emita `iss`. Debería estar siempre
  # configurado: es lo que impide que un emisor distinto pase por el legítimo.
  token-issuer: ${TOKEN_ISSUER:}

  # Versión del contrato de identidad que este gateway entiende (claim `ver`).
  token-contract-version: ${TOKEN_CONTRACT_VERSION:1}

  # URL del webhook-dispatcher. Vacía = webhooks apagados en este despliegue: el gateway
  # deja de preguntar por suscripciones y no hay ninguna que limpiar (ADR-020).
  dispatcher-url: ${DISPATCHER_URL:}

  # Timeouts del cliente HTTP saliente (Schema Registry y dispatcher).
  #
  # Listar event types consulta al dispatcher una vez por tipo: es un camino frecuente, y
  # sin tope un servicio que acepta la conexión y no contesta se lleva puesto el pool de
  # hilos de Tomcat y con él al gateway entero.
  http-connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS}
  http-read-timeout-ms: ${HTTP_READ_TIMEOUT_MS}
  # Tope de espera por la confirmación de Kafka al publicar.
  publish-timeout-ms: ${PUBLISH_TIMEOUT_MS:10000}
  # ── Ajustes que dependen del ambiente ──────────────────────────────────────
  #
  # Los tres valores de acá abajo son los de PRODUCCIÓN y están escritos literales, sin
  # variable de entorno de por medio. Para aflojarlos hay que activar el perfil
  # `development` (SPRING_PROFILES_ACTIVE=development), que carga
  # application-development.yml y los pisa a los tres de una sola vez.
  #
  # Antes eran tres variables sueltas, y ese era el problema: se podían poner dos y
  # olvidar la tercera, y nada lo notaba. Con un perfil no hay estado parcial posible, y
  # cualquier valor que no sea exactamente `development` —vacío, mal escrito, otro
  # nombre— deja la configuración de producción.


  # ── Límites ────────────────────────────────────────────────────────────────
  # Un evento es un hecho de negocio, no un archivo: 256 KB deja lugar de sobra para
  # cualquier payload razonable y corta los que sólo pueden ser un error.
  max-payload-bytes: ${MAX_PAYLOAD_BYTES:262144}
  # Peticiones por minuto y por namespace. No frena a un atacante —para eso está la
  # autenticación—; evita que el loop de un grupo deje sin servicio a los otros siete.
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:600}




# La documentación OpenAPI: no hay forma de protegerla con Bearer —el navegador no lo
# manda al cargar la página— así que en vez de dejarla pública o devolver un 401 que
# parece un bug, directamente no existe. SecurityConfig lee esta misma propiedad para
# decidir si abre las rutas, así que las dos cosas se mueven juntas.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    # La UI se sirve en /doc en vez de la ruta larga por defecto.
    path: /doc

# ── Observabilidad ────────────────────────────────────────────────────────────
# Las métricas van en un puerto aparte del tráfico de negocio, y ese puerto se publica
# sólo en loopback (ver docker-compose). Así no hay forma de llegar a ellas desde
# internet ni a través del reverse-proxy: se leen por túnel SSH, igual que kafka-ui.
# Por eso el chain de seguridad del puerto de management no exige token — el aislamiento
# lo da la red, no un header.
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # Sin los buckets, micrometer sólo publica el total y la suma de duraciones, así que
      # lo único calculable es el promedio. El promedio esconde justo lo que interesa: una
      # petición de 10 segundos entre mil de 5 ms no lo mueve. Con histograma se puede
      # pedir el percentil 95.
      percentiles-histogram:
        http.server.requests: true
    tags:
      # Con varias instancias, distingue de cuál viene cada serie.
      instance: ${HOSTNAME:local}

logging:
  level:
    # DEBUG vuelca payloads de negocio al log.
    com.citypass: INFO
