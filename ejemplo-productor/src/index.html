<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ejemplo-productor</title>
</head>
<body>
  <h1>ejemplo-productor</h1>
  <p id="msg"></p>

  <h2>Schemas registrados</h2>
  <ul id="schema-list"><li>Cargando…</li></ul>

  <h2>Registrar schema</h2>
  <form method="post" action="/schemas">
    <p>
      <label for="namespace">Namespace:</label><br>
      <input type="text" id="namespace" name="namespace"
             placeholder="com.citypass.movilidad" required>
    </p>
    <p>
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name"
             placeholder="BiciDevuelta" required>
    </p>
    <p>
      <section>
[
  {"name": "userId",    "type": "string"},
  {"name": "biciId",   "type": "string"},
  {"name": "estacionId","type": "string"}
]
      </section>
      <label for="fields">Fields (JSON array, sin los campos base):</label><br>
      <textarea id="fields" name="fields" rows="10" cols="60" required></textarea>
    </p>
    <button type="submit">Registrar schema</button>
  </form>

  <h2>Publicar evento</h2>
  <form method="post" action="/events">
    <p>
      <label for="topic">Event type (FQN):</label><br>
      <select id="topic" name="topic" required>
        <option value="">-- seleccioná un schema --</option>
      </select>
    </p>
    <p>
      <label for="data">Data (JSON):</label><br>
      <textarea id="data" name="data" rows="8" cols="60" required
                placeholder='{"userId": "user-42"}'></textarea>
    </p>
    <button type="submit">Publicar evento</button>
  </form>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('msg')) document.getElementById('msg').textContent = params.get('detail');

    fetch('/api/schemas')
      .then(r => r.json())
      .then(({ eventTypes = [] }) => {
        document.getElementById('schema-list').innerHTML =
          eventTypes.length
            ? eventTypes.map(t => `<li>${t}</li>`).join('')
            : '<li>No hay schemas registrados.</li>';
        const sel = document.getElementById('topic');
        eventTypes.forEach(t => sel.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`));
      });
  </script>
</body>
</html>
