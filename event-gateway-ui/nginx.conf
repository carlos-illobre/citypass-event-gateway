server {
    listen 80;
    root /usr/share/nginx/html;

    # La configuración del ambiente la escribe el entrypoint en cada arranque. Si el
    # navegador la cacheara, alguien que visitó otro despliegue seguiría apuntando a las
    # URLs viejas sin forma de enterarse — es el error clásico de este patrón.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # El bundle lleva hash en el nombre, así que puede cachearse indefinidamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: cualquier ruta que no sea un archivo se resuelve con el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
